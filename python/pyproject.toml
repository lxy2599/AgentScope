[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "agentscope-sdk"
version = "0.1.0"
description = "AgentScope Python SDK and Runner"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27,<1",
    "typer>=0.12,<1",
    "pydantic>=2,<3",
    "PyYAML>=6,<7",
    "opentelemetry-api>=1.25,<2",
    "opentelemetry-sdk>=1.25,<2",
    "opentelemetry-exporter-otlp-proto-http>=1.25,<2",
]

[project.optional-dependencies]
dev = [
    "mypy>=2.3,<2.4",
    "pip-audit>=2.10.1,<2.11",
    "pytest>=8",
    "pytest-httpx>=0.30",
    "ruff>=0.16,<0.17",
]

[project.scripts]
agentscope-runner = "agentscope_sdk.cli:app"

[tool.setuptools.packages.find]
include = ["agentscope_sdk*"]

[tool.setuptools.package-data]
agentscope_sdk = ["*.patch"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"examples/*" = ["RUF001", "RUF002", "RUF003"]

[tool.mypy]
python_version = "3.11"
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
