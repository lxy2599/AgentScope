[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agentlab-benchmarks"
version = "0.1.0"
description = "Versioned benchmark catalog and worker contracts for AgentLab"
requires-python = ">=3.11"
dependencies = ["PyYAML>=6.0"]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
benchmarkctl = "benchmarkctl.cli:main"
benchmark-worker = "benchmark_worker.cli:main"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"

[tool.setuptools.packages.find]
where = ["src"]
