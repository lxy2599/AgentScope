services:
  redis:
    image: redis:7.4-alpine
    command:
      - redis-server
      - --appendonly
      - "no"
      - --save
      - ""
    ports:
      - "${AGENTSCOPE_REDIS_PORT:-16379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 2s
      retries: 30
