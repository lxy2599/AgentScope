name: agentlab

x-agent-runtime-environment: &agent-runtime-environment
  # Observed agents run on this Compose network. Use Docker DNS for the
  # control plane instead of host.docker.internal: on Linux, host-gateway can
  # resolve to docker0 while this project is attached to another bridge.
  AGENTSCOPE_SERVER_URL: "http://agentscope:8080"
  AGENTSCOPE_PROJECT_TOKEN: "${AGENTSCOPE_PROJECT_TOKEN:-}"
  OPENHANDS_AGENTSCOPE_ENABLED: "true"
  HERMES_AGENTSCOPE_ENABLED: "true"
  HERMES_AGENTSCOPE_AGENT_NAME: "hermes-interactive"
  ARK_API_KEY: "${ARK_API_KEY:-}"
  LLM_API_KEY: "${LLM_API_KEY:-${ARK_API_KEY:-}}"
  LLM_MODEL: "${BENCHMARK_MODEL:-openai/deepseek-v4-flash}"
  LLM_BASE_URL: "${LLM_BASE_URL:-${ARK_BASE_URL:-}}"
  HTTP_PROXY: "${AGENTLAB_DOCKER_PROXY_URL:-}"
  HTTPS_PROXY: "${AGENTLAB_DOCKER_PROXY_URL:-}"
  NO_PROXY: "${NO_PROXY:-localhost,127.0.0.1,::1,agentscope,postgres,clickhouse,openhands,hermes,benchmarks-worker}"

x-agent-runtime: &agent-runtime
  extra_hosts:
    - "host.docker.internal:host-gateway"
  environment: *agent-runtime-environment

services:
  agentscope:
    build:
      context: ..
      dockerfile: Dockerfile.agentlab
    image: agentlab/agentscope:local
    environment:
      AGENTSCOPE_HTTP_ADDR: ":8080"
      AGENTSCOPE_DATABASE_URL: "postgres://agentscope:agentscope@postgres:5432/agentlab?sslmode=disable"
      AGENTSCOPE_CLICKHOUSE_DSN: "clickhouse://clickhouse:9000/agentscope_traces"
      AGENTSCOPE_SESSION_SECRET: "${AGENTSCOPE_SESSION_SECRET:?run scripts/agentlab.sh bootstrap}"
      AGENTSCOPE_ENV: development
      AGENTSCOPE_SECURE_COOKIES: "false"
      AGENTSCOPE_REALTIME_ENABLED: "false"
      AGENTSCOPE_ANOMALY_ENABLED: "false"
      AGENTSCOPE_BENCHMARK_RUNNER_ENABLED: "false"
    depends_on:
      postgres:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
    ports:
      - "127.0.0.1:${AGENTLAB_HTTP_PORT:-18080}:8080"
    # Keep the locally built SPA available through the same control-plane URL,
    # matching the previous host-process launcher. The Go server treats a
    # missing/empty dist directory as optional.
    volumes:
      - "../web/dist:/app/web/dist:ro"

  postgres:
    image: postgres:16.14
    environment:
      POSTGRES_DB: agentlab
      POSTGRES_USER: agentscope
      POSTGRES_PASSWORD: agentscope
    ports:
      - "127.0.0.1:${AGENTLAB_POSTGRES_PORT:-15432}:5432"
    volumes:
      - agentlab_pgdata:/var/lib/postgresql/data
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agentscope -d agentlab"]
      interval: 3s
      timeout: 3s
      retries: 30

  clickhouse:
    image: clickhouse/clickhouse-server:26.6.1.1193
    environment:
      CLICKHOUSE_DB: agentscope_traces
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
    ports:
      - "127.0.0.1:${AGENTLAB_CLICKHOUSE_TCP_PORT:-19001}:9000"
      - "127.0.0.1:${AGENTLAB_CLICKHOUSE_HTTP_PORT:-18124}:8123"
    volumes:
      - agentlab_chdata:/var/lib/clickhouse
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://localhost:8123/ping | grep -q Ok"]
      interval: 3s
      timeout: 3s
      retries: 30

  openhands:
    <<: *agent-runtime
    build:
      context: ../openhands
      dockerfile: Dockerfile.task-runner
      target: interactive
      args:
        HTTP_PROXY: "${AGENTLAB_DOCKER_PROXY_URL:-}"
        HTTPS_PROXY: "${AGENTLAB_DOCKER_PROXY_URL:-}"
      extra_hosts:
        - "host.docker.internal:host-gateway"
    image: agentlab/openhands:local
    ports:
      - "127.0.0.1:${AGENTLAB_OPENHANDS_PORT:-18000}:8000"
    command: ["--host", "0.0.0.0", "--port", "8000"]

  hermes:
    <<: *agent-runtime
    build:
      context: ../hermes
      dockerfile: Dockerfile
      args:
        HTTP_PROXY: "${AGENTLAB_DOCKER_PROXY_URL:-}"
        HTTPS_PROXY: "${AGENTLAB_DOCKER_PROXY_URL:-}"
      extra_hosts:
        - "host.docker.internal:host-gateway"
    image: agentlab/hermes:local
    entrypoint: ["/opt/hermes/.venv/bin/hermes-agentlab-service"]
    command: ["--host", "0.0.0.0", "--port", "8000"]
    ports:
      - "127.0.0.1:${AGENTLAB_HERMES_PORT:-18001}:8000"
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent http://127.0.0.1:8000/healthz >/dev/null"]
      interval: 5s
      timeout: 3s
      retries: 30

  benchmarks-worker:
    <<: *agent-runtime
    build:
      context: ../benchmarks
      dockerfile: Dockerfile.worker
      args:
        HTTP_PROXY: "${AGENTLAB_DOCKER_PROXY_URL:-}"
        HTTPS_PROXY: "${AGENTLAB_DOCKER_PROXY_URL:-}"
      extra_hosts:
        - "host.docker.internal:host-gateway"
    image: agentlab/benchmarks-worker:local
    environment:
      AGENTSCOPE_SERVER_URL: "http://agentscope:8080"
      AGENTSCOPE_PROJECT_TOKEN: "${AGENTSCOPE_PROJECT_TOKEN:-}"
      HERMES_AGENTSCOPE_ENABLED: "true"
      HERMES_AGENTSCOPE_AGENT_NAME: "hermes-benchmark"
      ARK_API_KEY: "${ARK_API_KEY:-}"
      LLM_API_KEY: "${LLM_API_KEY:-${ARK_API_KEY:-}}"
      LLM_MODEL: "${BENCHMARK_MODEL:-openai/deepseek-v4-flash}"
      LLM_BASE_URL: "${LLM_BASE_URL:-${ARK_BASE_URL:-}}"
      HTTP_PROXY: "${AGENTLAB_DOCKER_PROXY_URL:-}"
      HTTPS_PROXY: "${AGENTLAB_DOCKER_PROXY_URL:-}"
      NO_PROXY: "${NO_PROXY:-localhost,127.0.0.1,::1,agentscope,postgres,clickhouse,openhands,hermes,benchmarks-worker}"
      AGENTLAB_SIDECAR_HOST: host.docker.internal
      # Ephemeral agent sidecars join this Compose network so they can reach
      # the per-trial Harbor Tool Gateway inside this Worker. The gateway port
      # is never published to the host.
      AGENTLAB_SIDECAR_NETWORK: agentlab_default
      AGENTLAB_TOOL_GATEWAY_HOST: benchmarks-worker
      # Local Harbor fixtures are trusted deployment assets, not catalog data.
      # Mount at the identical host path because Harbor creates Docker task
      # environments through this Worker's daemon socket.
      AGENTLAB_BENCHMARK_CATALOG_ROOT: "${AGENTLAB_BENCHMARK_CATALOG_ROOT:?run scripts/agentlab.sh or set an absolute catalog root}"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - agentlab_workerdata:/work
      - "${AGENTLAB_BENCHMARK_CATALOG_ROOT:?run scripts/agentlab.sh or set an absolute catalog root}:${AGENTLAB_BENCHMARK_CATALOG_ROOT:?run scripts/agentlab.sh or set an absolute catalog root}:ro"
    command:
      - --server-url
      - "http://agentscope:8080"
      - --worker-id
      - "${AGENTLAB_WORKER_ID:-harbor-local}"
      - --work-root
      - /work
      - --heartbeat-interval-s
      - "${AGENTLAB_WORKER_HEARTBEAT_S:-20}"

volumes:
  agentlab_pgdata:
  agentlab_chdata:
  agentlab_workerdata:
