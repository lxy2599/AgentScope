services:
  postgres:
    image: postgres:16.14
    environment:
      POSTGRES_DB: agentscope_test
      POSTGRES_USER: agentscope
      POSTGRES_PASSWORD: agentscope
    ports:
      - "${AGENTSCOPE_POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  clickhouse:
    image: clickhouse/clickhouse-server:26.6.1.1193
    environment:
      CLICKHOUSE_DB: agentscope_traces
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
    ports:
      - "${AGENTSCOPE_CLICKHOUSE_PORT:-19000}:9000"
    volumes:
      - chdata:/var/lib/clickhouse

volumes:
  pgdata:
  chdata:
